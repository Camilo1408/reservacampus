# API Gateway + servidor del frontend
limit_req_zone $binary_remote_addr zone=api:10m rate=300r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/auth/           { limit_req zone=api burst=600 nodelay; proxy_pass http://auth:8000/; }
    location /api/reservas/       { limit_req zone=api burst=600 nodelay; proxy_pass http://reservas:8000/; }
    location /api/notificaciones/ { limit_req zone=api burst=600 nodelay; proxy_pass http://notificaciones:8000/; }
    location /api/chat/           { limit_req zone=api burst=20 nodelay; proxy_pass http://chatbot:8000/; }
}

# Integración continua: pruebas de cada microservicio contra PostgreSQL 16 real (como en producción)
# y pruebas end-to-end con Playwright.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  unitarias:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [auth, reservas, notificaciones, chatbot]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/${{ matrix.servicio }}
    env:
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r ../../tests/requirements-test.txt
      - run: python -m pytest -q

  e2e:
    runs-on: ubuntu-latest
    needs: unitarias
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencias de todos los servicios
        run: |
          for s in auth reservas notificaciones chatbot; do pip install -r services/$s/requirements.txt; done
          pip install -r tests/requirements-dev.txt
          python -m playwright install --with-deps chromium
      - run: python -m pytest tests/e2e -q
